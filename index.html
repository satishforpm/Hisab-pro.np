<!DOCTYPE html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HisabPro – सबै हिसाब, एउटै App</title><meta name="description" content="HisabPro: Calculator, EMI, VAT, Age, Date Difference, Currency, Nepal Land Calculator. Works offline, no login."><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f5f9;--c:#fff;--t:#0f1b2d;--m:#6b7a90;--g:#2e9e48;--o:#f59e0b;--n:#0b1f3a;--b:#e3e8ef}
:root[data-th=dark]{--bg:#0a1424;--c:#13233b;--t:#eaf0f8;--m:#8fa2bd;--b:#223654}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#cfd8e3;font-family:system-ui,'Noto Sans Devanagari',sans-serif;color:var(--t)}
#app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:600px){#app{height:min(860px,96vh);margin:2vh auto;border-radius:34px;box-shadow:0 20px 60px #0004;border:8px solid #111}}
header{background:var(--n);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px}
header img{height:34px;max-width:150px;object-fit:contain}header h1{font-size:17px;margin:0;flex:1}
.ib{background:#ffffff22;border:0;color:#fff;border-radius:12px;min-width:42px;height:42px;font-size:15px;font-weight:700}
main{flex:1;overflow:auto;padding:14px}
nav{display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:10px 0;font-size:12px}nav button.on{color:var(--g);font-weight:700}nav span{display:block;font-size:20px}
.hero{background:linear-gradient(135deg,#0b1f3a,#1b5e3a);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero p{margin:4px 0 12px;opacity:.9;font-size:14px}.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;background:var(--o);color:#1b1200}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--m)}h3{margin:16px 2px 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tl{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:12px 4px;text-align:center;font-size:12px;color:var(--t);min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tl i{font-style:normal;font-size:26px}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--g);color:#fff}.btn.s{background:var(--c);color:var(--t);border:1px solid var(--b)}
.r{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--b);font-size:15px}.r:last-child{border:0}.r b{text-align:right;word-break:break-word}
.err{background:#fde8e8;color:#b42318;border-radius:12px;padding:12px;margin-top:10px}
.disp{background:var(--n);color:#fff;border-radius:20px;padding:16px;text-align:right;min-height:110px;margin-bottom:10px;word-break:break-all}
.disp small{display:block;color:#9fb3cf;font-size:18px;min-height:26px}.disp div{font-size:38px;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kp button{height:56px;border:0;border-radius:16px;font-size:22px;background:var(--c);color:var(--t);border:1px solid var(--b)}
.kp .op{background:#e8f6ec;color:var(--g);font-weight:700}[data-th=dark] .kp .op{background:#1a3a2a}.kp .eq{background:var(--g);color:#fff;grid-column:span 2}.kp .ac{color:#d92d20}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t)}
.cr{text-align:center;padding:18px 10px;background:#0b1f3a;border-radius:20px;color:#fff;margin-top:18px}.cr img{width:84px;height:84px;border-radius:50%;background:#fff}
.cr small{color:#9fb3cf}.so{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.so a{background:#ffffff22;color:#fff;text-decoration:none;padding:9px 12px;border-radius:12px;font-size:13px}
#sp{position:absolute;inset:0;background:var(--n);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .4s}#sp img{width:220px}
